      gap: '<ruby>検査<rt>けんさ</rt></ruby>や<ruby>処置<rt>しょち</rt></ruby>の<ruby>手順<rt>てじゅん</rt></ruby>への<ruby>不安<rt>ふあん</rt></ruby>、<ruby>痛<rt>いた</rt></ruby>みの<ruby>程度<rt>ていど</rt></ruby>の<ruby>心構<rt>こころがま</rt></ruby>え。',
      support: '<ruby>処置<rt>しょち</rt></ruby>のステップと<ruby>所要<rt>しょよう</rt></ruby><ruby>時間<rt>じかん</rt></ruby>の<ruby>見通<rt>みとお</rt></ruby>しをやさしく<ruby>可視化<rt>かしか</rt></ruby>します。'
    },
    'caregiver->doctor': {
      gap: '<ruby>本人<rt>ほんにん</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>では<ruby>言<rt>い</rt></ruby>いにくい<ruby>夜間<rt>やかん</rt></ruby>の<ruby>様子<rt>ようす</rt></ruby>や、<ruby>介護<rt>かいご</rt></ruby><ruby>者<rt>しゃ</rt></ruby><ruby>自身<rt>じしん</rt></ruby>の<ruby>疲労<rt>ひろう</rt></ruby>が<ruby>隠<rt>かく</rt></ruby>れがちです。',
      support: '<ruby>生活<rt>せいかつ</rt></ruby>の<ruby>困<rt>こま</rt></ruby>りごとを<ruby>具体的<rt>ぐたいてき</rt></ruby>なエピソードとして<ruby>整理<rt>せいり</rt></ruby>する<ruby>手助<rt>てだす</rt></ruby>けをします。'
    }
  };

  function selectRole(target, roleKey, icon, labelName, labelRuby) {
    const isSender = target === 'sender';
    const buttons = document.querySelectorAll(isSender ? '.sender-btn' : '.receiver-btn');

    // Update internal state
    if (isSender) {
      state.sender = roleKey;
      state.senderIcon = icon;
      state.senderName = labelName;
      state.senderRuby = labelRuby;
    } else {
      state.receiver = roleKey;
      state.receiverIcon = icon;
      state.receiverName = labelName;
      state.receiverRuby = labelRuby;
    }

    // Refresh UI buttons: high-contrast blue fill for selected, soft container for unselected
    buttons.forEach((btn) => {
      const match = btn.getAttribute('data-role') === roleKey;
      btn.setAttribute('aria-checked', match ? 'true' : 'false');
      const checkIcon = btn.querySelector('.check-icon');
      const mainIcon = btn.querySelector('.material-symbols-outlined:not(.check-icon)');

      if (match) {
        btn.className = `${isSender ? 'sender-btn' : 'receiver-btn'} ${btn.classList.contains('col-span-2') ? 'col-span-2' : ''} min-h-[56px] w-full p-space-sm rounded-xl bg-primary text-on-primary shadow-md flex items-center justify-between text-left transition-all`;
        if (checkIcon) checkIcon.classList.remove('opacity-0');
        if (mainIcon) mainIcon.style.fontVariationSettings = "'FILL' 1";
      } else {
        btn.className = `${isSender ? 'sender-btn' : 'receiver-btn'} ${btn.classList.contains('col-span-2') ? 'col-span-2' : ''} min-h-[56px] w-full p-space-sm rounded-xl bg-surface-container text-on-surface hover:bg-surface-variant shadow-sm flex items-center justify-between text-left transition-all`;
        if (checkIcon) checkIcon.classList.add('opacity-0');
        if (mainIcon) mainIcon.style.fontVariationSettings = "'FILL' 0";
      }
    });

    // Update Banner graphic
    updateGraphicBanner();
    // Update live previews
    updateSupportPreview();
  }

  function updateGraphicBanner() {
    const sIcon = document.getElementById('badge-sender-icon');
    const sLabel = document.getElementById('badge-sender-label');
    const rIcon = document.getElementById('badge-receiver-icon');
    const rLabel = document.getElementById('badge-receiver-label');

    if (sIcon) sIcon.textContent = state.senderIcon;
    if (sLabel) sLabel.innerHTML = `<ruby>${state.senderName}<rt>${state.senderRuby}</rt></ruby>`;

    if (rIcon) rIcon.textContent = state.receiverIcon;
    if (rLabel) rLabel.innerHTML = `<ruby>${state.receiverName}<rt>${state.receiverRuby}</rt></ruby>`;
  }

  function updateSupportPreview() {
    const pairKey = `${state.sender}->${state.receiver}`;
    const defaultData = {
      gap: 'お<ruby>互<rt>たが</rt></ruby>いの<ruby>立場<rt>たちば</rt></ruby>による<ruby>関心事<rt>かんしんごと</rt></ruby>の<ruby>違<rt>ちが</rt></ruby>いや、<ruby>用語<rt>ようご</rt></ruby>の<ruby>理解<rt>りかい</rt></ruby>の<ruby>差<rt>さ</rt></ruby>。',
      support: '<ruby>対話<rt>たいわ</rt></ruby>の<ruby>要点<rt>ようてん</rt></ruby>をリアルタイムで<ruby>整理<rt>せいり</rt></ruby>し、<ruby>確認<rt>かくにん</rt></ruby>したいポイントをメモに<ruby>残<rt>のこ</rt></ruby>します。'
    };
    const content = pairMatrix[pairKey] || defaultData;

    const gapEl = document.getElementById('gap-description');
    const supportEl = document.getElementById('support-description');

    if (gapEl) gapEl.innerHTML = content.gap;
    if (supportEl) supportEl.innerHTML = content.support;
  }

  function confirmPairing() {
    // Save pair preferences to local storage for the transcription session
    try {
      localStorage.setItem('med_pair_sender', state.sender);
      localStorage.setItem('med_pair_receiver', state.receiver);
    } catch (e) {
      // ignore storage unavailability
    }
    // Subtle tactile feedback trigger
    if (window.navigator && window.navigator.vibrate) {
      window.navigator.vibrate(30);
    }
    // Proceed to voice calibration / live transcription step
    window.location.href = '#calibrating-voice';
  }
</script></main>
