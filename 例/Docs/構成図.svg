<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1290" viewBox="0 0 1300 1290" style="font-family:'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="1300" height="1290" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9aa0a6"/></marker></defs>
<text x="60" y="80" font-size="30" font-weight="700" fill="#202124">Cloud Run が Gemini との間に立ち、AI の答えを検査してから端末に返す</text>
<rect x="280" y="130" width="440" height="150" rx="14" fill="#fff" stroke="#d0d0d0" stroke-width="2"/><text x="500.0" y="178.0" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">ユーザー</text><text x="500.0" y="216.0" text-anchor="middle" font-size="21" fill="#5f6368">聞く人の端末（ブラウザから利用）</text><text x="500.0" y="248.0" text-anchor="middle" font-size="21" fill="#5f6368">話す人と聞く人の会話を聞く</text><rect x="880" y="130" width="360" height="150" rx="14" fill="#fff" stroke="#d0d0d0" stroke-width="2"/><text x="1060.0" y="178.0" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">端末の中の履歴</text><text x="1060.0" y="216.0" text-anchor="middle" font-size="21" fill="#5f6368">ブラウザの保存領域</text><text x="1060.0" y="248.0" text-anchor="middle" font-size="21" fill="#5f6368">サーバーには残さない</text><path d="M722,225 L876,225" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#a)"/><text x="800" y="195" font-size="18" fill="#5f6368" text-anchor="middle">⑥ 終えたら保存</text><rect x="50" y="420" width="1200" height="790" rx="18" fill="#f1f3f4" stroke="#c4c7c5" stroke-width="2" stroke-dasharray="10 8"/><text x="80" y="462" font-size="22" fill="#5f6368">Google Cloud（asia-northeast1）</text><path d="M470,282 L470,543" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M530,543 L530,282" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="320" font-size="20" fill="#5f6368" text-anchor="end">① 端末の音声認識で会話を文字にする</text><text x="450" y="349" font-size="20" fill="#5f6368" text-anchor="end">② 発言を送る（HTTPS）</text><text x="550" y="320" font-size="20" fill="#5f6368" text-anchor="start">⑤ 検査した結果を返す</text><text x="550" y="349" font-size="20" fill="#5f6368" text-anchor="start">　 端末が「分かりますか？」を出す</text><rect x="280" y="545" width="440" height="230" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="3"/><image x="464.0" y="565" width="72" height="72" href="data:image/svg+xml;base64,"/><text x="500.0" y="673" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">Cloud Run</text><text x="500.0" y="711" text-anchor="middle" font-size="21" fill="#5f6368">Next.js（画面と API）</text><text x="500.0" y="743" text-anchor="middle" font-size="21" fill="#5f6368">上限の確認・指示文・答えの検査</text><rect x="860" y="545" width="360" height="230" rx="14" fill="#fff" stroke="#d0d0d0" stroke-width="2"/><text x="1040.0" y="601.0" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">コードで守ること</text><text x="1040.0" y="639.0" text-anchor="middle" font-size="21" fill="#5f6368">発言にない言葉・説明文を捨てる</text><text x="1040.0" y="671.0" text-anchor="middle" font-size="21" fill="#5f6368">数字が変わる直しを捨てる</text><text x="1040.0" y="703.0" text-anchor="middle" font-size="21" fill="#5f6368">回数と長さに上限</text><text x="1040.0" y="735.0" text-anchor="middle" font-size="21" fill="#5f6368">データベースは使わない</text><path d="M722,660 L858,660" stroke="#9aa0a6" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M470,777 L470,948" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M530,948 L530,777" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="830" font-size="20" fill="#5f6368" text-anchor="end">③ 指示文を送る</text><text x="450" y="859" font-size="20" fill="#5f6368" text-anchor="end">⑦ 要約を頼む（押したときだけ）</text><text x="550" y="830" font-size="20" fill="#5f6368" text-anchor="start">④ 言葉と読み・話した人・</text><text x="550" y="859" font-size="20" fill="#5f6368" text-anchor="start">　 聞き間違いの直しを JSON で返す</text><rect x="280" y="950" width="440" height="220" rx="14" fill="#fff" stroke="#d0d0d0" stroke-width="2"/><image x="464.0" y="970" width="72" height="72" href="data:image/svg+xml;base64,"/><text x="500.0" y="1078" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">Gemini（Vertex AI）</text><text x="500.0" y="1116" text-anchor="middle" font-size="21" fill="#5f6368">言葉を見つけ、決めた形で返す</text><text x="500.0" y="1148" text-anchor="middle" font-size="21" fill="#5f6368">意味や答えは書かせない</text></svg>