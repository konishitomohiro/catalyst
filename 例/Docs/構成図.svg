<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="960" viewBox="0 0 1900 960" style="font-family:'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="1900" height="960" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5f6368"/></marker></defs>
<rect x="60" y="150" width="440" height="560" rx="24" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="3"/>
<text x="280" y="215" text-anchor="middle" font-size="36" font-weight="700" fill="#202124">聞く人の端末</text>
<text x="280" y="260" text-anchor="middle" font-size="26" fill="#5f6368">ブラウザ（Chrome など）</text>
<rect x="110" y="300" width="340" height="110" rx="14" fill="#fff" stroke="#dadce0" stroke-width="2"/>
<text x="280" y="347" text-anchor="middle" font-size="27" fill="#202124">音声認識で</text>
<text x="280" y="387" text-anchor="middle" font-size="27" fill="#202124">会話を文字にする</text>
<rect x="110" y="430" width="340" height="110" rx="14" fill="#fff" stroke="#dadce0" stroke-width="2"/>
<text x="280" y="477" text-anchor="middle" font-size="27" fill="#202124">吹き出しと</text>
<text x="280" y="517" text-anchor="middle" font-size="27" fill="#202124">「分かりますか？」を出す</text>
<rect x="110" y="560" width="340" height="110" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
<text x="280" y="607" text-anchor="middle" font-size="27" fill="#202124">履歴は端末の中にだけ保存</text>
<text x="280" y="647" text-anchor="middle" font-size="24" fill="#5f6368">（サーバーには残さない）</text>
<rect x="740" y="70" width="1100" height="820" rx="24" fill="none" stroke="#4285f4" stroke-width="3" stroke-dasharray="14 10"/>
<text x="780" y="125" font-size="32" font-weight="700" fill="#4285f4">Google Cloud（asia-northeast1）</text>
<rect x="800" y="200" width="460" height="460" rx="20" fill="#fff" stroke="#dadce0" stroke-width="3"/>
<image x="955" y="225" width="150" height="150" href="data:image/svg+xml;base64,"/>
<text x="1030" y="420" text-anchor="middle" font-size="36" font-weight="700" fill="#202124">Cloud Run</text>
<text x="1030" y="465" text-anchor="middle" font-size="25" fill="#5f6368">Next.js（画面と API）</text>
<text x="1030" y="525" text-anchor="middle" font-size="24" fill="#202124">・呼び出し回数と長さの上限</text>
<text x="1030" y="565" text-anchor="middle" font-size="24" fill="#202124">・指示文を作る</text>
<text x="1030" y="605" text-anchor="middle" font-size="24" fill="#202124">・返ってきた答えを検査する</text>
<rect x="1400" y="200" width="400" height="460" rx="20" fill="#fff" stroke="#dadce0" stroke-width="3"/>
<image x="1525" y="225" width="150" height="150" href="data:image/svg+xml;base64,"/>
<text x="1600" y="420" text-anchor="middle" font-size="36" font-weight="700" fill="#202124">Vertex AI</text>
<text x="1600" y="465" text-anchor="middle" font-size="25" fill="#5f6368">Gemini</text>
<text x="1600" y="525" text-anchor="middle" font-size="24" fill="#202124">言葉と読み・話した人・</text>
<text x="1600" y="565" text-anchor="middle" font-size="24" fill="#202124">聞き間違いの直しを</text>
<text x="1600" y="605" text-anchor="middle" font-size="24" fill="#202124">JSON で返す／要約を作る</text>
<line x1="505" y1="370" x2="790" y2="370" stroke="#5f6368" stroke-width="4" marker-end="url(#a)"/>
<text x="610" y="350" text-anchor="middle" font-size="22" fill="#5f6368">発言（HTTPS）</text>
<line x1="795" y1="500" x2="510" y2="500" stroke="#5f6368" stroke-width="4" marker-end="url(#a)"/>
<text x="610" y="540" text-anchor="middle" font-size="22" fill="#5f6368">検査した結果</text>
<line x1="1265" y1="370" x2="1390" y2="370" stroke="#5f6368" stroke-width="4" marker-end="url(#a)"/>
<line x1="1395" y1="500" x2="1270" y2="500" stroke="#5f6368" stroke-width="4" marker-end="url(#a)"/>
<text x="1330" y="350" text-anchor="middle" font-size="22" fill="#5f6368">指示文</text>
<text x="1330" y="540" text-anchor="middle" font-size="22" fill="#5f6368">JSON</text>
<text x="1320" y="760" font-size="22" text-anchor="middle" font-size="23" fill="#5f6368">AI に言葉の意味や答えは書かせない。発言にない言葉・説明文と、数字が変わる直しはコードで捨てる</text>
<text x="1320" y="810" text-anchor="middle" font-size="24" fill="#5f6368">データベースは使わない（会話をサーバーに保存しない）</text>
</svg>